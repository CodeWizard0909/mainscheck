# --- GS2 ---------------------------------------------------------------------

gs2-2023-q1: >
  Account for the legal and political factors responsible for the reduced frequency
  of using Article 356 by the Union Governments since the mid-1990s.

gs2-2023-q2: >
  Explain the constitutional perspective of gender justice with the help of relevant
  Constitutional provisions and case laws.

gs2-2023-q3: >
  e-governance, as a critical tool of governance, has ushered in effectiveness,
  transparency and accountability in governments. What inadequacies hamper the
  enhancement of these features?

gs2-authored-q1: >
  "The Constitution of India is a living document that has evolved through judicial
  interpretation." Examine this statement with reference to the basic structure
  doctrine.

# --- GS3 ---------------------------------------------------------------------

gs3-2023-q1: >
  Faster economic growth requires increased share of the manufacturing sector in GDP,
  particularly of MSMEs. Comment on the present policies of the Government of India in
  this regard.

gs3-2023-q2: >
  What is the status of digitalization in the Indian economy? Examine the problems
  faced in this regard and suggest improvements.

gs3-2023-q3: >
  Introduce the concept of Artificial Intelligence (AI). How does AI help clinical
  diagnosis? Do you perceive any threat to privacy of the individual in the use of AI
  in healthcare?

# --- Essay -------------------------------------------------------------------

essay-2023-a2: >
  Visionary decision-making happens at the intersection of intuition and logic.

essay-2023-b3: >
  A society that has more justice is a society that needs less charity.

essay-2023-b4: >
  Education is what remains after one has forgotten what one has learned in school.
