# Rates are US dollars per million tokens.
#
# This file only matters for the hosted `--grader anthropic` path. The default grader
# runs a local model through Ollama, which has no per-call price: there, cost is
# reported as latency and tokens, and every dollar column stays blank. Local models
# are deliberately absent below rather than listed at 0.00, because a zero would read
# as a measured price rather than as "this question does not apply".
#
# Prices change. Re-check them against the published price list before publishing any
# cost figure, and update `checked_on` when you do. A benchmark that quietly reports
# stale pricing is worse than one that reports none - leave a model out and its cost
# column stays blank rather than showing a number nobody can trust.

checked_on: 2026-09-21
source: >
  Anthropic first-party API rates, from the bundled claude-api skill reference table
  (that table was itself cached 2026-06-24). Not verified against the live pricing
  page on the checked_on date - do that before publishing.

models:
  claude-opus-5:
    input_per_mtok: 5.00
    output_per_mtok: 25.00
  claude-sonnet-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00
  claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
