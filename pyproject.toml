[project]
name = "mainscheck"
version = "0.1.0"
description = "An open reliability test for AI grading of UPSC Mains answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx2>=2.13",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "click>=8.1",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
mainscheck = "mainscheck.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mainscheck"]
